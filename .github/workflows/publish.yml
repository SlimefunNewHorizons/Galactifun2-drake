name: Publish
on:
  push:
    branches: [main]
    paths: [src/**, plugin/**, sf4k-bakedlibs/**, buildSrc/**, build.gradle*, settings.gradle*, gradle.properties]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    uses: SlimefunNewHorizons/.github/.github/workflows/publish-blob.yml@main
    with:
      project: Galactifun2-Drake
      file: plugin/build/libs/*-all.jar
      java-version: 21
      blob: ${{ github.event_name != workflow_dispatch }}
    secrets: inherit
